name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motoparts-android/motoparts-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          build-root-directory: motoparts-android/motoparts-android
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: motoparts-debug-apk
          path: motoparts-android/motoparts-android/app/build/outputs/apk/debug/*.apk
